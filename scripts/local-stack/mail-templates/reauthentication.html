<!doctype html>
<!-- GoTrue "reauthentication" template for the local stack: always carries the 6-digit code so e2e can read it from Mailpit (scripts/local-stack/otp.sh). -->
<html lang="en">
  <body style="font-family: system-ui, sans-serif; color: #111">
    <h2>Confirm it is you</h2>
    <p>Your Earth code:</p>
    <p style="font-size: 32px; letter-spacing: 6px">
      <strong data-earth-otp="{{ .Token }}">{{ .Token }}</strong>
    </p>
    <p>The code expires in 10 minutes. If you did not request it, ignore this email.</p>
    <!-- earth-otp:{{ .Token }} -->
  </body>
</html>
